[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "trace-completeness"
version = "0.1.0"
description = "A synthetic source-use benchmark for swarm forensics under partial telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
tracebench = "tracebench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
