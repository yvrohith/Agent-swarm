name: Research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chronology provenance checks inspect the original public source commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen --extra dev
      - name: Lint and test
        run: |
          uv run ruff check .
          uv run pytest
      - name: Reproduce the identifiability counterexample
        run: uv run tracebench equivalence
